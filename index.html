let chapterIndex=0;
let questionIndex=0;
let answers=quizData.map(ch=>ch.questions.map(()=>null));
let chapterScores=[];

function show(id){
 ["welcome","quiz","chapterResult","finalResult"].forEach(x=>
  document.getElementById(x).classList.add("hidden")
 );
 document.getElementById(id).classList.remove("hidden");
}

function startQuiz(){
 chapterIndex=0;questionIndex=0;
 renderQuestion();show("quiz");
}

function renderQuestion(){
 const chapter=quizData[chapterIndex];
 const question=chapter.questions[questionIndex];
 const completedBefore=quizData.slice(0,chapterIndex)
  .reduce((n,c)=>n+c.questions.length,0);
 const totalQuestions=quizData.reduce((n,c)=>n+c.questions.length,0);

 document.getElementById("chapterLabel").textContent=
  "Chapter "+(chapterIndex+1)+" / 10";
 document.getElementById("questionLabel").textContent=
  "Question "+(questionIndex+1)+" / 10";
 document.getElementById("questionNumber").textContent=
  "QUESTION "+(questionIndex+1);
 document.getElementById("questionText").textContent=question[0];
 document.getElementById("progressFill").style.width=
  ((completedBefore+questionIndex)/totalQuestions*100)+"%";

 const box=document.getElementById("options");
 box.innerHTML="";

 question[1].forEach((option,index)=>{
  const btn=document.createElement("button");
  btn.className="option"+
   (answers[chapterIndex][questionIndex]===index?" selected":"");
  const letter=document.createElement("span");
  letter.className="option-letter";
  letter.textContent="ABCD"[index];
  const label=document.createElement("span");
  label.textContent=option;
  btn.append(letter,label);
  btn.onclick=()=>selectAnswer(index);
  box.appendChild(btn);
 });

 document.getElementById("backBtn").disabled=
  chapterIndex===0&&questionIndex===0;
 document.getElementById("nextBtn").disabled=
  answers[chapterIndex][questionIndex]===null;
 document.getElementById("nextBtn").textContent=
  questionIndex===9?
   (chapterIndex===9?"Finish Quiz":"Complete Chapter"):"Next";
}

function selectAnswer(index){
 answers[chapterIndex][questionIndex]=index;
 renderQuestion();
}

function previousQuestion(){
 if(questionIndex>0){
  questionIndex--;
 }else if(chapterIndex>0){
  chapterIndex--;questionIndex=9;
 }
 renderQuestion();
}

function nextQuestion(){
 if(answers[chapterIndex][questionIndex]===null)return;
 if(questionIndex<9){
  questionIndex++;renderQuestion();return;
 }
 completeChapter();
}

function completeChapter(){
 const chapter=quizData[chapterIndex];
 let score=0;
 chapter.questions.forEach((q,i)=>{
  if(answers[chapterIndex][i]===q[2])score++;
 });
 chapterScores[chapterIndex]=score;
 showChapterResult();
}

function getChapterComment(score){
 if(score===10)return "Perfect! Fami unakku full-ah theriyum pola! ❤️";
 if(score>=8)return "Semma da! Fami pathi nalla therinji vechirukka!";
 if(score>=6)return "Not bad! Innum konjam details therinjukkanum!";
 if(score>=4)return "Aiyo! Fami pathi innum neraya learn panna vendiyirukku!";
 return "Deiii! Fami-va thirumba introduce panna vendiyadhu pola! 😂";
}

function showChapterResult(){
 const chapter=quizData[chapterIndex];
 const score=chapterScores[chapterIndex];

 document.getElementById("chapterResultKicker").textContent=
  "Chapter "+(chapterIndex+1)+" — "+chapter.section;
 document.getElementById("chapterScore").textContent=score+" / 10";
 document.getElementById("chapterComment").textContent=
  getChapterComment(score);

 const review=document.getElementById("chapterReview");
 review.innerHTML="";

 chapter.questions.forEach((q,i)=>{
  const chosen=answers[chapterIndex][i];
  const correct=q[2];
  if(chosen===correct)return;

  const item=document.createElement("div");
  item.className="review-item wrong";
  const title=document.createElement("strong");
  title.textContent="Question "+(i+1)+": "+q[0];
  const your=document.createElement("p");
  your.className="your-answer";
  your.textContent="Your answer: "+
   (chosen===null?"Not answered":q[1][chosen]);
  const right=document.createElement("p");
  right.className="correct-answer";
  right.textContent="Correct answer: "+q[1][correct];
  item.append(title,your,right);
  review.appendChild(item);
 });

 if(score===10){
  review.innerHTML="<p class='correct-answer'>All answers correct! No mistakes! ❤️</p>";
 }

 document.getElementById("continueBtn").textContent=
  chapterIndex===9?"See My Final Result ❤️":"Next Chapter ❤️";
 show("chapterResult");
}

function continueQuiz(){
 if(chapterIndex<9){
  chapterIndex++;questionIndex=0;
  renderQuestion();show("quiz");
 }else{
  showFinalResult();
 }
}

  return "Halfway there da! Fami-va innum konjam observe pannu. Avaloda little habits and favourites learn pannu!";
 if(score>=30)
  return "Aiyo Athish! Fami unakku innum oru mystery-ah dhaan irukka pola! Time to pay more attention! 😂";
 return "Deiii! Fami-va pudhusa meet panra madhiri irukku! Innum neraya pesanum, neraya memories create pannanum! ❤️";
}

function showFinalResult(){
 const total=chapterScores.reduce((a,b)=>a+b,0);
 document.getElementById("totalScore").textContent=total+" / 100";
 document.getElementById("finalComment").textContent=getFinalComment(total);

 const list=document.getElementById("allChapterScores");
 list.innerHTML="";

 quizData.forEach((chapter,i)=>{
  const row=document.createElement("div");
  row.className="chapter-card";
  const name=document.createElement("strong");
  name.textContent="Chapter "+(i+1)+" — "+chapter.section;
  const score=document.createElement("div");
  score.className="score-row";
  const label=document.createElement("span");
  label.textContent="Chapter score";
  const value=document.createElement("strong");
  value.textContent=chapterScores[i]+" / 10";
  score.append(label,value);
  const comment=document.createElement("div");
  comment.className="small";
  comment.textContent=getChapterComment(chapterScores[i]);
  row.append(name,score,comment);
  list.appendChild(row);
 });
 show("finalResult");
}
</script>
